# AnuRupa Matrimony — build and deploy to Azure App Service.
#
# Every push to main builds the Next.js standalone bundle on a Linux runner
# and ships it to the web app created by azure/infra.sh. Pull requests build
# but do not deploy, so a broken branch is caught before it can be merged.
#
# Authentication is OpenID Connect: GitHub mints a short-lived token for this
# run, and Azure accepts it because a user-assigned managed identity
# (anurupa-github-deploy, in the resource group) carries a federated
# credential naming this repository and branch. There is no stored secret
# anywhere — the three IDs below are identifiers, not credentials.
#
# Repository variables this needs (Settings → Secrets and variables →
# Actions → Variables; azure/README.md has the `gh variable set` commands):
#   AZURE_CLIENT_ID         the managed identity's client ID
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   AZURE_WEBAPP_NAME       e.g. anurupa-8c72e8
#   SITE_URL                e.g. https://anurupa-8c72e8.azurewebsites.net
#
# Application secrets (ADMIN_PASSWORD_HASH, SESSION_SECRET, DATABASE_URL,
# AZURE_STORAGE_KEY) are deliberately NOT here. They live in App Service
# configuration, written by azure/infra.sh and azure/deploy-local.sh, so read
# access to this repository does not hand over production.

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "vercel.json"
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets azure/login request the OIDC token

# One deploy at a time, and never cancel one that has started uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build the standalone bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src
        continue-on-error: true

      # NEXT_PUBLIC_SITE_URL is read at build time, not at run time: Next.js
      # inlines NEXT_PUBLIC_* into the client bundle. Setting it only in App
      # Service would leave the browser with the wrong base URL for share
      # links. AZURE_BUILD switches next.config.ts to standalone output.
      #
      # Building here, on Linux, also means sharp's native linux-x64 binary is
      # what gets traced into the bundle, rather than the WebAssembly fallback
      # a bundle built on a Mac ends up running on App Service.
      - name: Build
        run: npm run build
        env:
          AZURE_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      # Standalone traces only the files the server needs. `static` and
      # `public` are served rather than imported, so Next.js leaves them out
      # of the trace and they have to be copied in by hand. Zipped under UTC
      # so the container does not report every file's time stamp as being in
      # the future.
      - name: Assemble the bundle
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p bundle/.next
          cp -R .next/standalone/. bundle/
          cp -R .next/static bundle/.next/static
          if [ -d public ]; then cp -R public bundle/public; fi
          ( cd bundle && TZ=UTC zip -r -q ../anurupa.zip . )
          du -h anurupa.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: anurupa.zip
          retention-days: 7

  deploy:
    name: Deploy to App Service
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      # A missing variable would otherwise surface as an opaque login error
      # several steps later.
      - name: Check the repository variables are set
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          done
          exit $missing

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: anurupa.zip

      # App Service reports success as soon as the zip lands, which is before
      # the container has restarted. Without this a broken build shows up as a
      # green run and a dead site.
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/browse" || echo 000)
            case "$code" in
              200|302|307) echo "HTTP $code after $((i * 15))s"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Site never came back; last status ${code:-none}"
          exit 1
