# AnuRupa Matrimony — build and deploy to Azure App Service.
#
# Every push to main builds the Next.js standalone bundle and ships it to the
# web app created by azure/infra.sh. Pull requests build but do not deploy, so
# a broken branch is caught before it can be merged.
#
# Before the first run, in Azure DevOps:
#
#   1. Project settings → Service connections → New → Azure Resource Manager
#      → Workload identity federation (automatic). Name it exactly
#      `anurupa-azure` (or change azureServiceConnection below) and scope it
#      to the resource group azure/infra.sh created.
#
#   2. Pipelines → Library → + Variable group, named `anurupa-azure`, with:
#        azureResourceGroup   e.g. anurupa-rg
#        azureAppName         e.g. anurupa-a1b2c3
#        siteUrl              e.g. https://anurupa-a1b2c3.azurewebsites.net
#      Then Pipeline permissions → allow this pipeline to use the group.
#
# Application secrets (ADMIN_PASSWORD_HASH, SESSION_SECRET, SUPABASE_*,
# DATABASE_URL) are deliberately NOT set here. They live in App Service
# configuration, written once by azure/infra.sh and azure/deploy-local.sh, so
# a person with read access to this repository cannot read them.

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - README.md
      - '**/*.md'

pr:
  branches:
    include:
      - main

variables:
  - group: anurupa-azure
  - name: azureServiceConnection
    value: anurupa-azure
  - name: nodeVersion
    value: '22.x'
  - name: bundleDir
    value: '$(Build.ArtifactStagingDirectory)/bundle'
  - name: packagePath
    value: '$(Build.ArtifactStagingDirectory)/anurupa.zip'

stages:
  # ---------------------------------------------------------------- build --
  - stage: Build
    displayName: Build
    jobs:
      - job: build
        displayName: Build the standalone bundle
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: Restore the npm cache
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(Pipeline.Workspace)/.npm

          - script: npm ci --cache "$(Pipeline.Workspace)/.npm" --no-audit --no-fund
            displayName: Install dependencies

          - script: npx tsc --noEmit
            displayName: Type-check

          - script: npx eslint src
            displayName: Lint
            continueOnError: true

          # NEXT_PUBLIC_SITE_URL is read at build time, not at run time: Next.js
          # inlines NEXT_PUBLIC_* into the client bundle. Setting it only in App
          # Service would leave the browser with the wrong base URL for share
          # links. AZURE_BUILD switches next.config.ts to standalone output.
          - script: npm run build
            displayName: Build
            env:
              AZURE_BUILD: '1'
              NEXT_TELEMETRY_DISABLED: '1'
              NEXT_PUBLIC_SITE_URL: $(siteUrl)

          # Standalone traces only the files the server needs. `static` and
          # `public` are served rather than imported, so Next.js leaves them
          # out of the trace and they have to be copied in by hand.
          - script: |
              set -euo pipefail
              test -f .next/standalone/server.js
              mkdir -p "$(bundleDir)/.next"
              cp -R .next/standalone/. "$(bundleDir)/"
              cp -R .next/static "$(bundleDir)/.next/static"
              if [ -d public ]; then cp -R public "$(bundleDir)/public"; fi
              du -sh "$(bundleDir)"
            displayName: Assemble the bundle

          - task: ArchiveFiles@2
            displayName: Zip the bundle
            inputs:
              rootFolderOrFile: $(bundleDir)
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(packagePath)
              replaceExistingArchive: true

          - publish: $(packagePath)
            artifact: bundle
            displayName: Publish the artifact

  # --------------------------------------------------------------- deploy --
  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: deploy
        displayName: Deploy to App Service
        pool:
          vmImage: ubuntu-latest
        environment: anurupa-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: bundle

                - task: AzureWebApp@1
                  displayName: Deploy to $(azureAppName)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(azureAppName)
                    resourceGroupName: $(azureResourceGroup)
                    package: $(Pipeline.Workspace)/bundle/anurupa.zip
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'node server.js'
                    deploymentMethod: zipDeploy

                # App Service reports success as soon as the zip lands, which
                # is before the container has restarted. Without this a broken
                # build shows up as a green pipeline and a dead site.
                - script: |
                    set -euo pipefail
                    for i in $(seq 1 30); do
                      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$(siteUrl)" || echo 000)
                      case "$code" in
                        200|302|307) echo "HTTP $code after ${i}0s"; exit 0 ;;
                      esac
                      sleep 10
                    done
                    echo "Site never came back; last status: ${code:-none}" >&2
                    exit 1
                  displayName: Smoke test
